<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INSEP Acessível</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS principal -->
    <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="css/esqueceusenha.css">

</head>

<body>

    <!-- =========================
         HEADER PADRÃO
    ========================== -->
    <header>

        <div class="container py-3">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

                <!-- LOGO -->
                <div class="logo d-flex align-items-center">

                    <img
                        src="../images/logo.png"
                        alt="Logo INSEP Acessível"
                    >

                    <span>Acessível</span>

                </div>

                <!-- MENU -->
                <nav class="d-flex flex-wrap gap-3" aria-label="Menu principal">
                    <a href="../index.html" class="menu-link">Home</a>
                    <a href="#" class="menu-link">Sobre</a>
                    <a href="#" class="menu-link">Serviços</a>
                    <a href="../tutoriais/index.html" class="menu-link">Tutoriais</a>
                    <a href="../documentacao/index.html" class="menu-link">Documentação</a>
                    <a href="#" class="menu-link">Contato</a>
                </nav>

                <!-- AÇÕES -->
                <div class="acoes d-flex align-items-center gap-2">
                    <!-- Tema -->
                    <button
                        type="button"
                        id="tema"
                        class="btn btn-light"
                        aria-label="Alternar entre modo claro e escuro"
                        title="Alternar tema"
                    >
                        🌙
                    </button>

                    <!-- Voz -->
                    <button
                        type="button"
                        id="voz"
                        class="btn btn-light"
                        aria-label="Ativar leitura por voz"
                        title="Ativar leitura por voz"
                    >
                        🔊
                    </button>

                </div>

            </div>

        </div>

    </header>

    <!-- =========================
         CONTEÚDO DA PÁGINA
         
         DEIXAR ESTA PARTE
         PARA CADA EQUIPE/PESSOA
    ========================== -->

    <main>

        <section class="py-5">

            <div class="container">



    <div class="recovery-card">
        <div class="recovery-header">
            <h1>Recuperar Conta</h1>
            <p>Escolha como deseja receber o código de verificação para redefinir seu acesso.</p>
        </div>

        <form action="#" method="POST">
            <div class="option-group">
                <label class="option-card">
                    <input type="radio" name="method" value="email" checked>
                    <div class="option-info">
                        <span class="option-title">Enviar por E-mail</span>
                        <span class="option-desc">Receba um link ou código na sua caixa de entrada</span>
                    </div>
                </label>

                <label class="option-card">
                    <input type="radio" name="method" value="sms">
                    <div class="option-info">
                        <span class="option-title">Enviar por SMS</span>
                        <span class="option-desc">Receba um código no seu celular cadastrado</span>
                    </div>
                </label>
            </div>

            <div class="input-group">
                <label for="user-input">E-mail ou Celular registrado</label>
                <input 
                    type="text" 
                    id="user-input" 
                    name="user-input" 
                    placeholder="exemplo@email.com ou (11) 99999-9999" 
                    required
                >
            </div>

            <button type="submit" class="btn-submit">Enviar Código</button>
        </form>

        <div class="recovery-footer">
            <a href="../login/index.html">Voltar para o Login</a>
        </div>
    </div>            </div>

        </section>

    </main>

    <!-- =========================
         FOOTER PADRÃO
    ========================== -->

    <footer>

        <div class="container text-center py-3">

            © 2026 INSEP Acessível

        </div>

    </footer>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript principal -->
    <script src="../js/script.js"></script>

</body>

</html>
