<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acessível</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

    <body>

    <header>
        <div class="container py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

                <div class="logo">
                    <img src="../images/logo.png" alt="Logo INSEP Acessível"> Acessível
                </div>

                <nav class="d-flex flex-wrap gap-3">
                    <a href="../index.html" class="menu-link ativo">Home</a>
                    <a href="../sobre/index.html" class="menu-link">Sobre</a>
                    <a href="../tutoriais/index.html" class="menu-link">Tutoriais</a>
                </nav>

                <div class="acoes d-flex align-items-center gap-2">
                    <button id="tema" class="btn btn-light" aria-label="Alternar tema">
                        🌙
                    </button>

                    <button id="voz" class="btn btn-light" aria-label="Ativar leitura por voz">
                        🔊
                    </button>
                </div>

            </div>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL (Tela de Login) -->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="login-container">
            <div class="login-box">
                <h2>Login</h2>
                <form action="#">
                    
                    <div class="input-field">
                        <input type="email" required placeholder="E-mail" id="email-input">
                        <i class='bx bxs-envelope'></i>
                    </div>

                    <div class="input-field">
                        <input type="password" required placeholder="Senha" id="password-input">
                        <i class='bx bxs-lock-alt'></i>
                    </div>

                    <div class="remember-forget">
                        <label><input type="checkbox">Lembrar de mim</label>
                        <a href="../esqueceusenha/index.html">Esqueceu a senha?</a>
                    </div>

                    <button type="submit" class="btn-login">Entrar</button>

                    <div class="register-link">
                        <p>Não tem uma conta? <a href="../cadastro/index.html">Cadastre-se</a></p>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER (Mantido do modelo original) -->
    <footer>
        © 2026 INSEP Acessível
    </footer>

    <!-- Bootstrap JS + Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

</body>
</html>
