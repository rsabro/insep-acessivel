<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tela de Cadastro Completa</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../css/style.css">
  <!-- Ícones do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body>
    <header>
        <div class="container py-3">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

                <div class="logo">
                    <img src="images/logo.png" alt="Logo INSEP Acessível"> Acessível
                </div>

                <nav class="d-flex flex-wrap gap-3">
                    <a href="index.html" class="text-white text-decoration-none">Home</a>
                    <a href="#" class="text-white text-decoration-none">Sobre</a>
                    <a href="#" class="text-white text-decoration-none">Serviços</a>
                    <a href="#" class="text-white text-decoration-none">Contato</a>
                </nav>

                <div class="acoes d-flex align-items-center gap-2">
                    <a class="btn btn-light" href="login/index.html">
                        Entrar
                    </a>

                    <button id="tema" class="btn btn-light" aria-label="Alternar tema">
                        🌙
                    </button>

                    <button id="voz" class="btn btn-light" aria-label="Ativar leitura por voz">
                        🔊
                    </button>
                </div>

            </div>
        </div>
    </header>
    <section class="banner text-white">
  <div class="cadastro-container">
    <h2>Criar Conta</h2>
    <form id="registerForm">
      <!-- Nome -->
      <div class="input-group">
        <i class="fa fa-user"></i>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <!-- Sobrenome -->
      <div class="input-group">
        <i class="fa fa-user"></i>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
      </div>

      <!-- Sexo -->
      <div class="input-group">
        <i class="fa fa-venus-mars"></i>
        <select id="sexo" name="sexo" required>
          <option value="">Selecione o sexo</option>
          <option value="masculino">Masculino</option>
          <option value="feminino">Feminino</option>
          <option value="prefiro não responder">Prefiro não responder</option>
        </select>
      </div>

      <!-- Telefone -->
      <div class="input-group">
        <i class="fa fa-phone"></i>
        <input type="tel" id="telefone" name="telefone" 
                placeholder="Digite seu telefone com DDD" 
                required
                pattern="\d{2}\s?{4,5}-?\d{4}">
      </div>

      <!-- Email -->
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
      </div>

      <!-- Confirmar Email -->
      <div class="input-group">
        <i class="fa fa-envelope"></i>
        <input type="email" id="confirmEmail" name="confirmEmail" placeholder="Confirme seu e-mail" required>
      </div>

      <!-- Senha -->
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8">
      </div>

      <!-- Confirmar Senha -->
      <div class="input-group">
        <i class="fa fa-lock"></i>
        <input type="password" id="confirmSenha" name="confirmSenha" placeholder="Confirme sua senha" required minlength="8">
      </div>

      <button type="submit">Cadastrar</button>
    </form>
    <p id="registerMessage" role="alert"></p>
    <p class="login-link">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
</section>
  <script>
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const confirmEmail = document.getElementById("confirmEmail").value;
      const senha = document.getElementById("senha").value;
      const confirmSenha = document.getElementById("confirmSenha").value;

      // Regex para senha forte
      const regexSenha = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

      if(email !== confirmEmail) {
        document.getElementById("registerMessage").innerText = "Os e-mails não conferem!";
      } else if(senha !== confirmSenha) {
        document.getElementById("registerMessage").innerText = "As senhas não conferem!";
      } else if(!regexSenha.test(senha)) {
        document.getElementById("registerMessage").innerText = 
          "A senha deve ter no mínimo 8 caracteres, incluindo letra maiúscula, minúscula, número e símbolo.";
      } else {
        document.getElementById("registerMessage").innerText = "Conta criada com sucesso!";
      }
    });
  </script>
  <footer>
        © 2026 INSEP Acessível
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/script.js"></script>
</body>
</html>
